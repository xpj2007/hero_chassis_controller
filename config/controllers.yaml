controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController
    
    #-------车底盘数据-------
    wheel_radius: 0.07625
    wheel_track: 0.4
    wheel_base: 0.4
    # 仿真标定的偏航系数 k 和轮子半径 wheel_radius
    k_effective: 0.0
    wheel_radius_effective: 0.0
    #-------力矩限制---------
    effort_limit: 5.0
    #-------加速度限制-------
    chassis_line_accel_limit: 1.5
    chassis_angular_accel_limit: 2.0

    #--------静止判断-------
    zero_speed_threshold: 0.2

    #----低通滤波器截至频率----
    low_pass_filter_fc:  150.0

    #-------运行模式---------
    mode: 1
    #------话题和坐标系------
    cmd_vel_topic: /cmd_vel
    odometry_topic: /odom
    odom_frame: odom
    base_frame: base_link

    #--------PID参数--------
    left_front_wheel_pid:
      p: 2.4
      i: 0.8
      d: 0.0
      i_clamp_max: 0.8
      i_clamp_min: -0.8
      antiwindup: true
      publish_state: true

    right_front_wheel_pid:
      p: 2.4
      i: 0.8
      d: 0.0
      i_clamp_max: 0.8
      i_clamp_min: -0.8
      antiwindup: true
      publish_state: true

    left_back_wheel_pid:
      p: 2.4
      i: 0.8
      d: 0.0
      i_clamp_max: 0.8
      i_clamp_min: -0.8
      antiwindup: true
      publish_state: true

    right_back_wheel_pid:
      p: 2.4
      i: 0.8
      d: 0.0
      i_clamp_max: 0.8
      i_clamp_min: -0.8
      antiwindup: true
      publish_state: true

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 200